<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 刘骁 · 句子</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --paper: #faf9f7;
    --ink: #23211e;
    --ink-soft: #4f4a43;
    --muted: #8d8579;
    --line: rgba(35, 33, 30, .14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(120% 85% at 50% -25%, #fffefc 0%, rgba(255, 254, 252, 0) 58%),
      radial-gradient(95% 70% at 50% 118%, #f1ede4 0%, rgba(241, 237, 228, 0) 62%),
      var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .brand {
    position: fixed;
    top: max(22px, env(safe-area-inset-top));
    left: max(24px, env(safe-area-inset-left));
    margin: 0;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .18em;
    color: var(--ink-soft);
  }

  .brand span { margin: 0 .5em; color: var(--muted); }

  main {
    width: 100%;
    max-width: 30rem;
    text-align: center;
  }

  .code {
    margin: 0;
    font-size: clamp(68px, 17vw, 132px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -.02em;
  }

  .code span:nth-child(1) { color: #c9553f; }
  .code span:nth-child(2) { color: #3f7f6b; }
  .code span:nth-child(3) { color: #4a6fa5; }

  h1 {
    margin: 18px 0 0;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: .04em;
    color: var(--ink);
  }

  p.text {
    margin: 12px 0 0;
    font-size: 14px;
    line-height: 1.8;
    color: var(--muted);
  }

  .back {
    display: inline-block;
    margin-top: 34px;
    padding: 10px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: .08em;
    text-decoration: none;
    transition: border-color .18s ease, color .18s ease, background .18s ease;
  }

  .back:hover {
    border-color: rgba(35, 33, 30, .34);
    background: #fffefc;
    color: var(--ink);
  }

  .back:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<p class="brand">刘骁<span aria-hidden="true">·</span>句子</p>

<main>
  <p class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>
  <h1>这句话不见了。</h1>
  <p class="text">可能被删掉了，也可能从来没说过。</p>
  <a class="back" href="/">回到词云</a>
</main>

</body>
</html>
